<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CultureFit | 소규모 지역행사 통합 홍보 플랫폼</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="brand" aria-label="CultureFit 홈">
                <img src="resources/culturefit-logo.png" alt="CultureFit logo">
               
            </a>
            <nav class="site-nav" aria-label="주요 사이트 메뉴">
                <a href="events.html">행사 찾기</a>
                <a href="register.html">행사 등록</a>
                <a href="admin.html">관리자</a>
            </nav>
            <div class="header-actions">
                <a class="region-button" href="events.html">지역 선택</a>
                <span class="location-status" aria-live="polite"></span>
                <form class="search-wrap" action="events.html" method="get">
                    <input type="search" name="q" placeholder="행사명, 지역 검색" aria-label="행사 검색">
                    <button class="search-button" type="submit" aria-label="검색">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M10.8 4a6.8 6.8 0 1 1 0 13.6 6.8 6.8 0 0 1 0-13.6Zm0 2a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6Zm5.1 9.5 4.1 4.1-1.4 1.4-4.1-4.1 1.4-1.4Z"/>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <div class="hero-copy">
                <p class="eyebrow">지역의 모든 문화를 연결하다</p>
                <h1>CultureFit</h1>
             
                <div class="hero-actions">
                    <a class="primary-button" href="events.html">행사 둘러보기</a>
                    <a class="secondary-button" href="register.html">무료로 행사 등록하기</a>
                </div>
            </div>
            <div class="hero-panel" aria-label="CultureFit 핵심 정보">
                <div>
                    <strong>8+</strong>
                    <span>더미 행사 데이터</span>
                </div>
                <div>
                    <strong>5</strong>
                    <span>행사 카테고리</span>
                </div>
                <div>
                    <strong>pending</strong>
                    <span>등록 승인 흐름</span>
                </div>
            </div>
        </section>

        <section class="section-block">
            <div class="section-heading">
                <p class="eyebrow">Categories</p>
                <h2>카테고리별 행사 찾기</h2>
            </div>
            <div class="category-grid">
                <a href="events.html?price=무료" class="category-card">무료 행사</a>
                <a href="events.html?category=플리마켓" class="category-card">플리마켓</a>
                <a href="events.html?category=공연" class="category-card">공연</a>
                <a href="events.html?category=체험" class="category-card">체험</a>
                <a href="events.html?category=전시" class="category-card">전시</a>
            </div>
        </section>

        <section class="section-block">
            <div class="section-heading row-heading">
                <div>
                    <p class="eyebrow">This Week</p>
                    <h2>이번 주 행사</h2>
                </div>
                <a class="text-link" href="events.html">전체 보기</a>
            </div>
            <div class="event-grid" id="weekly-events"></div>
        </section>

        <section class="host-cta">
            <div>
                <p class="eyebrow">For hosts</p>
                <h2>작은 행사도 정확하게 알려질 수 있도록</h2>
                <p>행사 정보를 등록하면 관리자 승인 후 사용자 화면에 노출됩니다.</p>
            </div>
            <a class="primary-button" href="register.html">무료로 행사 등록하기</a>
        </section>
    </main>

    <footer class="site-footer">
        <p>CultureFit. 지역의 작은 행사를 한곳에.</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/location.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
